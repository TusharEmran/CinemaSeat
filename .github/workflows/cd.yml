name: CD

# Deploys ONLY on pushes to the default branch, and only after CI is green.
# Never on pull requests.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  # Never let two deploys touch the host at once.
  group: cd-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged with the commit sha, not just latest, so a rollback is
      # `deploy the previous sha` rather than a rebuild and a prayer.
      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: runtime
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:${{ steps.meta.outputs.sha }}
            ghcr.io/${{ github.repository }}/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/web:${{ steps.meta.outputs.sha }}
            ghcr.io/${{ github.repository }}/web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push proxy
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/proxy:${{ steps.meta.outputs.sha }}
            ghcr.io/${{ github.repository }}/proxy:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # NOTE: as written this recreates the api containers, which is a brief
      # blip, not a true rolling restart. To actually earn the "keep services
      # reachable" mark, scale up to 2x, wait for the new containers to pass
      # their health check, then scale back down — see the TODO in the script.
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/CinemaSeat
            git fetch --all && git reset --hard origin/main
            export IMAGE_TAG=${{ needs.build-and-push.outputs.sha }}
            docker compose -f docker-compose.yml -f infra/compose/compose.prod.yml pull
            # Migrations first, on their own, before any new code serves traffic.
            docker compose -f docker-compose.yml -f infra/compose/compose.prod.yml run --rm migrate
            # TODO: make this genuinely zero-downtime —
            #   scale api to 4, poll /health until the new containers are up,
            #   then scale back to 2 so nginx never has zero healthy upstreams.
            docker compose -f docker-compose.yml -f infra/compose/compose.prod.yml up -d \
              --no-deps --scale api=2 api worker web proxy

      - name: Smoke test the deployed URL
        run: ./scripts/smoke.sh ${{ secrets.DEPLOY_URL }}

      # TODO: on smoke failure, redeploy the previous sha. Write the rollback
      # down before you need it — you will not want to improvise at 4pm.
      - name: Report
        if: always()
        run: echo "Deployed ${{ needs.build-and-push.outputs.sha }} -> ${{ secrets.DEPLOY_URL }}"
