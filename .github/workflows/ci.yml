name: CI

# Runs on pull requests AND on pushes to the default branch.
# Branch protection makes this required, so nothing merges without it passing.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # A new push supersedes the old run on the same ref. Saves runner minutes on
  # a hackathon clock, and keeps the queue honest.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Change-aware: a docs-only PR should not spend six minutes running
  # testcontainers. This job decides what actually needs to run.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docker-compose.yml'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
            infra:
              - 'nginx/**'
              - 'infra/**'
              - 'docker-compose.yml'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # Integration tests bring up real Postgres and Redis via testcontainers.
      # The concurrency guarantee is a database index — testing it against a
      # fake would prove nothing.
      - run: npm run test:integration

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: backend/coverage/
          retention-days: 7

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  # The artifact judges will actually run. If this job fails, the submission
  # fails, regardless of what the unit tests say.
  compose-smoke:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: docker compose up from a clean clone
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Health, seat map and hold must all answer
        run: ./scripts/smoke.sh http://localhost:8080

      - name: Health stays green with the gateway stopped
        run: |
          docker compose stop gateway
          sleep 3
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/health)
          test "$code" = "200" || { echo "health degraded to $code"; exit 1; }
          curl -sf http://localhost:8080/api/showtimes/11111111-1111-1111-1111-111111111111/seatmap > /dev/null

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v

  # A single required status check, so branch protection needs one entry even
  # though the jobs above are conditional. Skipped jobs must not read as pass.
  ci-ok:
    needs: [backend, frontend, compose-smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any needed job failed
        run: |
          echo '${{ toJSON(needs) }}'
          echo '${{ toJSON(needs) }}' | grep -q '"result": "failure"' && exit 1
          echo '${{ toJSON(needs) }}' | grep -q '"result": "cancelled"' && exit 1
          exit 0
