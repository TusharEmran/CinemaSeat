# Local development. Compose picks this up automatically, so `docker compose up`
# gives you hot reload; CI and production pass explicit -f flags and never see it.
#
# Judges run plain `docker compose up`, which means they get this file too — so
# it must stay working, not just convenient.

services:
  api:
    build:
      target: build
    command: ["node", "--watch", "src/server.js"]
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
    volumes:
      - ./backend/src:/app/src:ro
    ports:
      - "3000:3000"          # bypass the proxy when you need to
    deploy:
      replicas: 1            # one replica is easier to debug

  worker:
    build:
      target: build
    command: ["node", "--watch", "src/workers/worker.js"]
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
    volumes:
      - ./backend/src:/app/src:ro

  postgres:
    ports:
      - "5432:5432"          # psql from the host

  redis:
    ports:
      - "6379:6379"
