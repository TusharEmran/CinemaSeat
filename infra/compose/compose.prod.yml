# Production overlay. Layered on top of docker-compose.yml, never instead of it:
#
#   docker compose -f docker-compose.yml -f infra/compose/compose.prod.yml up -d
#
# Differences from local: pre-built images from the registry (no building on a
# 2-vCPU VM), real secrets from the environment, resource limits, log rotation,
# and no exposed database ports.

name: cinemaseat

services:
  proxy:
    build: !reset null
    image: ghcr.io/${GITHUB_REPOSITORY:-owner/CinemaSeat}/proxy:${IMAGE_TAG:-latest}
    ports:
      - "80:80"

  api:
    build: !reset null
    image: ghcr.io/${GITHUB_REPOSITORY:-owner/CinemaSeat}/api:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL}
      # The gateway calls back here. Must be the PUBLIC url of the deployment,
      # not a compose service name — this is the single most common deploy-day
      # mistake, and it presents as "payments never confirm".
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL}
      GATEWAY_CALLBACK_SECRET: ${GATEWAY_CALLBACK_SECRET:?set GATEWAY_CALLBACK_SECRET}
      HOLD_TTL_SECONDS: ${HOLD_TTL_SECONDS:-120}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
      # NOTE: update_config is Swarm-only — plain `docker compose` ignores it.
      # It is here for a Swarm deploy; on a single VM the rolling restart is
      # done explicitly by the CD job (scale up, health check, scale down), so
      # do not rely on this block to keep the service reachable.
      update_config:
        parallelism: 1
        order: start-first
        delay: 5s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  worker:
    build: !reset null
    image: ghcr.io/${GITHUB_REPOSITORY:-owner/CinemaSeat}/api:${IMAGE_TAG:-latest}
    deploy:
      replicas: 1
      resources:
        limits: { cpus: "0.5", memory: 256M }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  migrate:
    build: !reset null
    image: ghcr.io/${GITHUB_REPOSITORY:-owner/CinemaSeat}/api:${IMAGE_TAG:-latest}
    environment:
      # Seed once on the first deploy, then set this false so a redeploy never
      # rewrites catalog data underneath a live booking.
      SEED_ON_BOOT: ${SEED_ON_BOOT:-false}

  web:
    build: !reset null
    image: ghcr.io/${GITHUB_REPOSITORY:-owner/CinemaSeat}/web:${IMAGE_TAG:-latest}

  postgres:
    # Not published. Reachable only on the compose network.
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  redis:
    ports: !reset []

  gateway:
    # Provided by the organisers, kept in the deployment so judges can hit the
    # same misbehaving service against the live URL.
    ports:
      - "9000:9000"
