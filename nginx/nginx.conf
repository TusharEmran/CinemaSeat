worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    # Request id threaded through to the API, so one seat's story can be
    # followed from the edge all the way into the worker logs.
    map $http_x_request_id $req_id {
        default   $http_x_request_id;
        ""        $request_id;
    }

    log_format json escape=json
        '{"time":"$time_iso8601","request_id":"$req_id","method":"$request_method",'
        '"uri":"$uri","status":$status,"upstream_time":"$upstream_response_time",'
        '"request_time":$request_time,"bytes":$body_bytes_sent}';

    access_log /var/log/nginx/access.log json;

    # Docker's embedded DNS, re-resolved so scaled replicas are picked up.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Compose DNS round-robins api replicas for us. `keepalive` matters more
    # than the balancing algorithm here — reconnecting per request under a
    # premiere burst is pure waste.
    upstream api_upstream {
        zone api_zone 64k;
        server api:3000 max_fails=3 fail_timeout=5s;
        keepalive 64;
    }

    # Rate limiting at the edge, so a burst never reaches Node at all.
    # Generous, because a premiere rush is legitimate traffic — this is an
    # abuse guard, not a queue.
    limit_req_zone $binary_remote_addr zone=holds:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=general:10m rate=100r/s;

    server {
        listen 80;
        server_name _;

        client_max_body_size 1m;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $req_id;

        # ── Judging hook #1 ─────────────────────────────────────────────────
        # No rate limit, no buffering, tight timeouts. Must answer well under a
        # second even while everything behind it is being hammered.
        location = /health {
            proxy_pass http://api_upstream;
            proxy_connect_timeout 1s;
            proxy_read_timeout    2s;
            access_log off;
        }

        location = /metrics {
            proxy_pass http://api_upstream;
            # TODO: restrict to your monitoring network before you call this shipped.
        }

        # The gateway callback. Never rate limited — throttling the gateway
        # makes it retry forever, which is the one thing the brief warns about.
        location ~ ^(/proxy/\d+)?/api/webhooks/payments {
            rewrite ^(/proxy/\d+)?(/api/webhooks/payments.*)$ $2 break;
            proxy_pass http://api_upstream;
            proxy_read_timeout 10s;
        }

        location ~ ^(/proxy/\d+)?/api/holds {
            limit_req zone=holds burst=40 nodelay;
            limit_req_status 429;
            rewrite ^(/proxy/\d+)?(/api/holds.*)$ $2 break;
            proxy_pass http://api_upstream;
            proxy_connect_timeout 2s;
            proxy_read_timeout    5s;
        }

        location ~ ^(/proxy/\d+)?/api/ {
            limit_req zone=general burst=200 nodelay;
            limit_req_status 429;
            rewrite ^(/proxy/\d+)?(/api/.*)$ $2 break;
            proxy_pass http://api_upstream;
            proxy_connect_timeout 2s;
            proxy_read_timeout    10s;
        }

        # Everything else is the SPA.
        location / {
            proxy_pass http://web:80;
        }
    }
}
